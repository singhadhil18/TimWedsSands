name: Deploy to web host
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SSH: ${{ secrets.SSH_PRIVATE_KEY != '' }}
      HAS_FTP: ${{ secrets.FTP_SERVER != '' }}
    steps:
      - uses: actions/checkout@v4

      # Option A — SSH (secret: SSH_PRIVATE_KEY; optional secrets/vars SSH_HOST, SSH_USER, SSH_PORT, DEPLOY_PATH)
      # The host has no rsync, so the site is sent as one tar archive and unpacked in place.
      - name: Deploy over SSH
        if: env.HAS_SSH == 'true'
        env:
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.SSH_HOST || vars.SSH_HOST || 'server5.webhostmost.com' }}
          USER: ${{ secrets.SSH_USER || vars.SSH_USER || 'xesuzeeq' }}
          PORT: ${{ vars.SSH_PORT || '2323' }}
          DEST: ${{ vars.DEPLOY_PATH || 'domains/timoanwedssandipa.co.za/public_html' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          tar -czf - index.html favicon.ico .htaccess admin.html assets \
            | ssh -i ~/.ssh/id_deploy -p "$PORT" -o BatchMode=yes "$USER@$HOST" \
                "mkdir -p '$DEST' && tar -xzf - -C '$DEST' && echo 'Deployed to $DEST'"

      # Option B — FTP (secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD; optional var FTP_DIR)
      - name: Deploy over FTPS
        if: env.HAS_SSH != 'true' && env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ vars.FTP_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            docs/**
            README.md
            .cpanel.yml

      - name: Nothing to deploy with
        if: env.HAS_SSH != 'true' && env.HAS_FTP != 'true'
        run: echo "::warning::No SSH or FTP secrets set - site was NOT uploaded."
